<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="naijaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008751" />
      <stop offset="100%" stop-color="#00663d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with Nigerian Green rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#naijaGreen)" />
  
  <!-- Subtle inner circle texture -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Central Emblem: Stylized Interconnected N with Nigerian Tricolor Band -->
  <g filter="url(#shadow)">
    <!-- White backing shield -->
    <rect x="96" y="96" width="320" height="320" rx="64" fill="#FFFFFF" />
    
    <!-- Vertical Green Stripes (Nigerian Flag DNA) -->
    <rect x="96" y="96" width="100" height="320" rx="40" fill="#008751" />
    <rect x="316" y="96" width="100" height="320" rx="40" fill="#008751" />
    
    <!-- Connection Hub & Nodes -->
    <circle cx="256" cy="180" r="28" fill="#008751" />
    <circle cx="256" cy="332" r="28" fill="#008751" />
    <circle cx="146" cy="256" r="22" fill="#FFFFFF" />
    <circle cx="366" cy="256" r="22" fill="#FFFFFF" />
    
    <!-- Dynamic Connection Bridge Lines -->
    <path d="M146 256 L256 180 L366 256 L256 332 Z" fill="none" stroke="#008751" stroke-width="12" stroke-linejoin="round" />
    <path d="M146 256 L366 256" stroke="#008751" stroke-width="8" stroke-dasharray="6 6" />
    
    <!-- Central Nigerian Star Node -->
    <circle cx="256" cy="256" r="16" fill="#008751" />
    <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
  </g>
</svg>
